<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flappy Bird — Hermes clone</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage">
    <div class="frame">
      <canvas id="game" width="400" height="600" aria-label="Flappy Bird game"></canvas>
      <button id="sound" class="sound" type="button" aria-pressed="true" title="Toggle sound">&#9835;</button>
    </div>
    <p class="help">Space / click / tap to flap &nbsp;·&nbsp; R to restart</p>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
